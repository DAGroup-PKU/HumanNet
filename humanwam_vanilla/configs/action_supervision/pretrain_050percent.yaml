gradient_accumulation_steps: 4
corpus: ${corpus_indices.1000h}
experiment:
  name: action_supervision/pretrain_050percent
  global_batch_size: 2048
  hours: 1000
  human_action_supervision_percent: 50
  pretrain_checkpoints:
  - 10000
  - 20000
  - 30000
  post_normalization_gripper_clip:
  - -1.0
  - 1.0
  supervised_episode_selection: ???
model:
  loss:
    lambda_action: 1.0
    component_weights:
      position: 1.0
      rotation: 0.5
      gripper: 0.1
