# Selection paths are relative to the corpus repository. Payload upload is separate.
corpus_release:
  repo_id: DAGroup-PKU/Open-HumanScale-50K
  index_url: https://huggingface.co/datasets/DAGroup-PKU/Open-HumanScale-50K/tree/main/subsets
  index_snapshot: '2026-11-05T16:05:39Z'
  format: LeRobot v3
  parts: indices/parts.parquet
  payload_status: uploading
  selection_format: LeRobot clip selection table
  manifest: subsets/manifest.json
  columns:
  - dataset_path
  - episode_index
  - start_frame
  - end_frame
  - source
  - task
  - hand
  frame_interval: episode-local [start_frame, end_frame)
  files: indices/files.parquet
corpus_indices:
  100h:
    nominal_hours: 100
    family: EgoStandard scaled-diversity
    mapping_status: complete
    selection_file: subsets/100h.parquet
    config_name: 100h
    note: Complete historical selection, including supplemental parts where needed.
  500h:
    nominal_hours: 500
    family: EgoStandard scaled-diversity
    mapping_status: complete
    selection_file: subsets/500h.parquet
    config_name: 500h
    note: Complete historical selection, including supplemental parts where needed.
  1000h:
    nominal_hours: 1000
    family: EgoStandard scaled-diversity
    mapping_status: complete
    selection_file: subsets/1000h.parquet
    config_name: 1000h
    note: Complete historical selection, including supplemental parts where needed.
  5000h:
