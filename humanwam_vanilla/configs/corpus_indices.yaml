    family: EgoStandard scaled-diversity
    mapping_status: complete
    selection_file: subsets/5000h.parquet
    config_name: 5000h
    note: Complete historical selection, including supplemental parts where needed.
  10000h:
    nominal_hours: 10000
    family: mixed-source historical corpus
    mapping_status: complete
    selection_file: subsets/10000h.parquet
    config_name: 10000h
    note: Frozen November 4, 2026; not yet bound to the historical report experiment.
  20500h:
    nominal_hours: 20500
    family: mixed-source historical corpus
    mapping_status: complete
    selection_file: subsets/20500h.parquet
    config_name: 20500h
  50000h:
    nominal_hours: 50000
    family: mixed-source historical corpus
    mapping_status: complete
    selection_file: subsets/50000h.parquet
    config_name: 50000h
  historical_10000h:
